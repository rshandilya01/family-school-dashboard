[project]
name = "family-school-dashboard"
version = "0.1.0"
description = "Local dashboard for two children's school records"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
